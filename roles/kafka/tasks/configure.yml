---
- name: Сформировать конфигурацию брокера Kafka
  ansible.builtin.template:
    src: server.properties.j2
    dest: "{{ kafka_config_dir }}/server.properties"
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: "0640"
  no_log: true
  notify: restart kafka

- name: Сформировать файл переменных окружения Kafka
  ansible.builtin.template:
    src: kafka-env.sh.j2
    dest: "{{ kafka_config_dir }}/kafka-env.sh"
    owner: root
    group: "{{ kafka_group }}"
    mode: "0640"
  notify: restart kafka

- name: Сформировать конфигурацию клиента администратора
  ansible.builtin.template:
    src: admin.properties.j2
    dest: "{{ kafka_config_dir }}/admin.properties"
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: "0600"
  no_log: true

- name: Установить службу systemd
  ansible.builtin.template:
    src: kafka.service.j2
    dest: /etc/systemd/system/kafka.service
    owner: root
    group: root
    mode: "0644"
  notify: restart kafka

